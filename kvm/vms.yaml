# Default VM config for `make vms-up` / `make experiment`, matching the
# default disk/nbd.yaml (`make nbd-config`'s defaults): one nbd_server
# listening on 127.0.0.1:10809. See kvm/vms.example.yaml for the full schema
# and a multi-VM/multi-disk example.
#
# kernel/initrd/append below boot the Debian guest image that `make
# guest-image` bakes onto disk/data/nbd_disk.img (see kvm/guest/build_image.sh)
# -- it runs WORKLOAD_SCRIPT (default kvm/guest/workloads/ycsb_bench.py,
# a real YCSB benchmark reading a pre-loaded SQLite dataset baked in under
# /opt/workload) once via systemd's workload.service on every boot, with
# output visible on the serial console (<log_dir>/vm0.serial.log).
# `systemd.volatile=state` mounts root (including /opt) read-only from the
# real disk, with only /var as a tmpfs overlay, since nbd_server discards
# every write a *running* guest makes anyway (disk/sim.hpp) -- this keeps
# the guest from depending on writes that would otherwise silently vanish,
# while still letting reads of baked-in data (like the YCSB dataset) really
# reach nbd_server. Don't use `systemd.volatile=yes` here: that tmpfs's
# everything outside /usr, which would silently wipe /opt/workload (and the
# baked-in dataset with it) on every boot.
#
# If you haven't run `make guest-image` yet -- or just want the plain
# simulator with no guest workload -- run `make disk` instead (a zero-filled
# file) and delete the kernel/initrd/append lines below; the VM will then
# sit at its firmware's "no bootable device" screen, which is still a real
# end-to-end check that QEMU successfully attached the NBD disk (watch
# nbd_server's stderr/log for "client connected").

defaults:
  qemu_binary: qemu-system-x86_64
  kvm: true          # set true on a host with /dev/kvm access -- the YCSB JVM (and faiss/numpy, if you switch back) is much slower under TCG emulation
  vcpus: 4
  memory: 4G
  run_dir: /tmp/kvm-launch
  log_dir: /tmp/kvm-launch
  daemonize: true
  display: none
  network:
    type: none
  kernel: disk/data/vmlinuz
  initrd: disk/data/initrd.img
  append: "root=/dev/vda ro console=ttyS0 systemd.volatile=state"

vms:
  - name: vm0
    disks:
      - nbd: {host: 127.0.0.1, port: 10809, export: vm0-root}   # -> /dev/vda
