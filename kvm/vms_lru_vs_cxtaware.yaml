# VM config for the lru+readahead vs. lru_cxt_aware+readahead_cxt_aware
# comparison (`make experiment-lru-readahead` / `make experiment-cxt-aware`).
# Two VMs sharing one nbd_server's cache, one per port -- see
# disk/nbd_lru_readahead.yaml and disk/nbd_cxt_aware.yaml, which both listen
# on these same two ports so this same VM config drives both runs. See
# kvm/vms.example.yaml for the full schema.
#
# kernel/initrd/append below boot the Debian guest image that `make
# guest-image` bakes onto disk/data/nbd_disk.img (see kvm/guest/build_image.sh)
# -- it runs WORKLOAD_SCRIPT (default kvm/guest/workloads/ycsb_bench.py, a
# real YCSB benchmark reading a pre-loaded SQLite dataset baked in under
# /opt/workload) once via systemd's workload.service on every boot, with
# output visible on the serial console (<log_dir>/<name>.serial.log).
# `systemd.volatile=state` mounts root (including /opt) read-only from the
# real disk, with only /var as a tmpfs overlay, since nbd_server discards
# every write a *running* guest makes anyway (disk/sim.hpp) -- this keeps
# the guest from depending on writes that would otherwise silently vanish,
# while still letting reads of baked-in data (like the YCSB dataset) really
# reach nbd_server. Don't use `systemd.volatile=yes` here: that tmpfs's
# everything outside /usr, which would silently wipe /opt/workload (and the
# baked-in dataset with it) on every boot.
#
# Needs `make guest-image` to have been run first -- otherwise both VMs will
# just sit at their firmware's "no bootable device" screen (still a valid
# check that QEMU attached the NBD disk, but no read traffic to compare
# policies against).

defaults:
  qemu_binary: qemu-system-x86_64
  kvm: false          # set true on a host with /dev/kvm access -- the YCSB JVM (and faiss/numpy, if you switch back) is much slower under TCG emulation
  vcpus: 4
  memory: 4G
  run_dir: /tmp/kvm-launch
  log_dir: /tmp/kvm-launch
  daemonize: true
  display: none
  network:
    type: none
  kernel: disk/data/vmlinuz
  initrd: disk/data/initrd.img
  append: "root=/dev/vda ro console=ttyS0 systemd.volatile=state"

vms:
  - name: vm0
    disks:
      - nbd: {host: 127.0.0.1, port: 10809, export: vm0-root}   # -> /dev/vda

  - name: vm1
    disks:
      - nbd: {host: 127.0.0.1, port: 10810, export: vm1-root}   # -> /dev/vda
