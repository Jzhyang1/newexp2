# Generated by `make nbd-config`; see disk/nbd.example.yaml for the schema.
source: local
file: disk/data/nbd_disk.img
ports: [10809]

# 2M of simulated disk cache -- online sources say up to 100GB is fair for disk cache,
# but we don't have that many processes and they don't run for long so we can be smaller
capacity: 8192
hit_latency_ns: 30000
miss_latency_ns: 300000
warmup: 0

evict_policy: lru
prefetch_policy: quickmine       # none | readahead | oracle | model-prefetcher | cminer | quickmine | mithril
latency_mode: simulated     # simulated | physical
oracle_file: ./logs/oracle.csv
# Required when prefetch_policy is `model-prefetcher`
prefetcher_path: offline.tsc_beam
prefetcher_type: predict_min
prefetcher_min_len: 16
prefetcher_training: ./logs/oracle.csv

log: ./logs/nbd_results.csv
access_log: ./logs/nbd_access.csv
vm_log_dir: ./kvm
prefetch_log: ./logs/nbd_prefetch.csv
