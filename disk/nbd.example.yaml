# Example config for nbd.cpp.
#
# One nbd server process backs a single file and listens on one TCP port per
# entry in `ports:`. Each port is a distinct client identity: a VM whose
# disk dials a given port is charged simulated hit/miss latency and tracked
# for virtual-time/prefetch purposes separately from every other port, so
# assign one port per VM disk you want the simulator to treat as a distinct
# client (see kvm/vms.example.yaml, where each VM disk names the host:port
# of the nbd server it should attach to). This has been migrated to command
# line for the most part.
#
# This is a deliberately small subset of YAML: flat `key: value` lines,
# `#` comments, and one inline list (`ports:`). Nesting is not supported.

source: local              # only "local" (a real backing file) is implemented
file: ./data.bin            # exported device size == this file's size
ports: [10809, 10810, 10811]

page_size: 65536            # cache/policy page size in bytes (power of two, >= 512); capacity, prefetch ranges and the
                            # hit counts in the logs are all in these units
capacity: 4096              # cache capacity, in pages of page_size bytes (4096 x 64 KiB = 256 MiB)
hit_latency_ns: 30000
miss_latency_ns: 300000
# simulated: the simulator accumulates latency in its stats (default).
# physical:  a read containing at least one cache miss is physically delayed
#            by a flat miss_latency_ns before the reply, so guest run time
#            becomes the metric.
latency_mode: simulated     # simulated | physical
warmup: 0                   # requests to skip before counting stats

evict_policy: lru           # none | fifo | lifo | lru
prefetch_policy: none       # none | readahead | oracle | model-prefetcher | cminer | quickmine | mithril
oracle_file: ./logs/oracle.csv  # nbd_access.csv-shaped approximate oracle trace
# Required when prefetch_policy is `model-prefetcher`; launched as `python3 -m <path>`
# before the NBD server starts accepting block clients.
prefetcher_path: offline.ts_mlr
prefetcher_type: predict_mean
prefetcher_min_len: 8
prefetcher_training: ./logs/oracle.csv

# If log_dir is present, none of the following files need to be present
log_dir: ./logs

# CSV stats log, appended to (header written once) on a clean shutdown
# (SIGINT/SIGTERM) -- see disk/nbd.cpp's AppendLog.
log: ./logs/nbd_results.csv

# Per-request event log (worker_id,offset,length,hits,total -- one CSV row
# per read() call SimReadClass sees, written+flushed immediately, unlike
# `log` above). Overwritten fresh on every server start. For verifying that
# VM/client I/O is being captured correctly (see disk/test_protocol.py and
# kvm/verify_capture.py). Enabled by default (it adds an fflush() per
# request, so beware the overhead on latency-sensitive runs); the config
# parser skips lines with an empty value, so the only way to disable it is
# to point it at a different path or change the default in disk/nbd.cpp.
access_log: ./logs/nbd_access.csv

# Per-prefetched-range log (worker_id,offset,length,hits,total,req), same
# shape as access_log so `python3 disk/heatmap.py logs/nbd_prefetch.csv
# --out prefetch_heatmap.png` renders what the prefetcher fetched next to
# the access heatmap. `hits`/`total` = pages already cached vs. in the range;
# `req` = index of the triggering read. Empty value disables (parser skips
# empty lines, so change the path/default to turn off).
prefetch_log: ./logs/nbd_prefetch.csv

# kvm/launch.py's log_dir. At shutdown, each <vm>.share/workload.info under it
# (written by the guest over 9p, if modified since the server started) fills
# the workload / workload_runtime_seconds columns of `log`. Missing files ->
# those columns are left empty.
vm_log_dir: ./kvm

# Per-request host-side feature log (offset, length, cmd type/flags, arrival/start/end ns on CLOCK_MONOTONIC, pread +
# policy time, think time, queue depth, page hits, prefetch-hit and issued counts). Empty/absent disables.
# feature_log: ./logs/nbd_features.csv
# Per-cache-event log: ts_ns,req,admit|evict,page,prefetched,resident_ns,hits,used. Empty/absent disables.
# cache_log: ./logs/nbd_cache.csv

# Guest writes go to a copy-on-write overlay: an unlinked temp file (created in
# overlay_dir, gone when the server exits) holding only modified blocks, plus an
# in-memory block->slot map. The backing file is never modified.
# overlay_block_size: copy-on-write granularity in bytes (power of two, multiple of 512).
# overlay_dir: /tmp
# overlay_block_size: 4096
